<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter Remote</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .status-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .status-value.running {
            color: #44FF44;
        }

        .status-value.paused {
            color: #FF4444;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
            touch-action: none;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 8px;
            transition: width 0.2s ease;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            border: none;
            border-radius: 15px;
            padding: 24px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-icon {
            font-size: 2rem;
        }

        .btn-play {
            background: linear-gradient(135deg, #44FF44, #22CC22);
            color: #000;
            grid-column: span 2;
        }

        .btn-play.running {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .btn-wpm-up {
            background: linear-gradient(135deg, #00BFFF, #0088CC);
            color: white;
        }

        .btn-wpm-down {
            background: linear-gradient(135deg, #FF6B6B, #CC4444);
            color: white;
        }

        .btn-restart {
            background: linear-gradient(135deg, #9B59B6, #8E44AD);
            color: white;
            grid-column: span 2;
        }

        .btn-rec {
            background: linear-gradient(135deg, #CC2222, #991111);
            color: white;
        }

        .btn-rec.active {
            background: linear-gradient(135deg, #FF4444, #CC2222);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .wpm-display {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            width: 100%;
            max-width: 350px;
        }

        .wpm-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFD700;
        }

        .wpm-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .pairing-box {
            display: none;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .pairing-box label {
            display: block;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: center;
        }

        .pairing-input {
            width: 100%;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 0.5em;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            background: #111;
            color: #FFD700;
            margin-bottom: 12px;
        }

        .pairing-error {
            color: #FF6666;
            font-size: 0.9rem;
            min-height: 1.3em;
            margin-top: 8px;
            text-align: center;
        }

        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .connection-status.connected {
            color: #44FF44;
            border: 1px solid #44FF44;
        }

        .connection-status.disconnected {
            color: #FF4444;
            border: 1px solid #FF4444;
        }

        .hint {
            margin-top: 20px;
            color: #666;
            font-size: 0.8rem;
            text-align: center;
        }

        .locked {
            filter: blur(4px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">● Disconnected</div>

    <h1>🎬 Teleprompter Remote</h1>

    <div class="pairing-box" id="pairingBox">
        <label>Enter the 6-digit code shown in the app</label>
        <input class="pairing-input" id="pairInput" inputmode="numeric"
               maxlength="6" autocomplete="off" placeholder="· · · · · ·">
        <button class="btn btn-restart" onclick="sendPair()">Pair</button>
        <div class="pairing-error" id="pairError"></div>
    </div>

    <div id="mainUI" class="locked">
        <div class="card">
            <div class="status-row">
                <span class="status-label">State:</span>
                <span class="status-value paused" id="statusText">Idle</span>
            </div>
            <div class="status-row">
                <span class="status-label">Progress:</span>
                <span class="status-value" id="progressText">0%</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="wpm-display">
            <div class="wpm-label">Words per minute</div>
            <div class="wpm-value" id="wpmValue">150</div>
        </div>

        <div class="controls">
            <button class="btn btn-play" id="btnPlay" onclick="togglePlay()" disabled>
                <span class="btn-icon">▶</span>
                <span>Start</span>
            </button>

            <button class="btn btn-wpm-up" id="btnWpmUp" onclick="wpmUp()" disabled>
                <span class="btn-icon">🔼</span>
                <span>+10 WPM</span>
            </button>

            <button class="btn btn-wpm-down" id="btnWpmDown" onclick="wpmDown()" disabled>
                <span class="btn-icon">🔽</span>
                <span>-10 WPM</span>
            </button>

            <button class="btn btn-restart" id="btnRestart" onclick="restartScroll()" disabled>
                <span class="btn-icon">🔄</span>
                <span>Restart</span>
            </button>

            <button class="btn btn-rec" id="btnRec" onclick="toggleRec()" disabled>
                <span class="btn-icon">⏺</span>
                <span>REC</span>
            </button>
        </div>
    </div>

    <div class="hint" id="hint">Controls unlock after pairing</div>

    <script>
        const socket = io();
        let paired = false;
        let lastState = {};

        // ── Connection indicator ────────────────────────────
        socket.on('connect', () => {
            setConnection(true);
            socket.emit('get_status');
        });

        socket.on('disconnect', () => {
            setConnection(false);
        });

        function setConnection(connected) {
            const el = document.getElementById('connectionStatus');
            el.className = 'connection-status ' + (connected ? 'connected' : 'disconnected');
            el.textContent = connected ? '● Connected' : '● Disconnected';
        }

        // ── Status updates from the app ────────────────────
        socket.on('status', (data) => {
            lastState = data;
            updateUI(data);
        });

        socket.on('paired', (data) => {
            paired = data.ok;
            if (!paired) {
                showPairError('Wrong code — check the app and try again');
            }
            applyPairing();
        });

        socket.on('error', (msg) => {
            showPairError(msg);
        });

        function showPairError(msg) {
            const el = document.getElementById('pairError');
            el.textContent = msg;
            setTimeout(() => { el.textContent = ''; }, 4000);
        }

        function applyPairing() {
            const needPair = lastState.pairing_required && !paired;
            document.getElementById('pairingBox').style.display = needPair ? 'block' : 'none';
            document.getElementById('mainUI').classList.toggle('locked', needPair);
            document.getElementById('hint').textContent = paired
                ? 'Drag the progress bar to jump'
                : 'Controls unlock after pairing';
            for (const id of ['btnPlay', 'btnWpmUp', 'btnWpmDown', 'btnRestart', 'btnRec']) {
                document.getElementById(id).disabled = needPair;
            }
        }

        function updateUI(data) {
            const statusText = document.getElementById('statusText');
            const btnPlay = document.getElementById('btnPlay');
            document.getElementById('wpmValue').textContent = data.wpm;

            if (data.countdown_active) {
                statusText.textContent = '🔴 Getting ready…';
                statusText.className = 'status-value paused';
                btnPlay.innerHTML = '<span class="btn-icon">⏹</span><span>Cancel</span>';
                btnPlay.classList.remove('running');
            } else if (data.is_running) {
                statusText.textContent = '▶ Playing';
                statusText.className = 'status-value running';
                btnPlay.innerHTML = '<span class="btn-icon">⏸</span><span>Pause</span>';
                btnPlay.classList.add('running');
            } else if (data.state === 'paused') {
                statusText.textContent = '⏸ Paused';
                statusText.className = 'status-value paused';
                btnPlay.innerHTML = '<span class="btn-icon">▶</span><span>Resume</span>';
                btnPlay.classList.remove('running');
            } else {
                statusText.textContent = '⏸ Idle';
                statusText.className = 'status-value paused';
                btnPlay.innerHTML = '<span class="btn-icon">▶</span><span>Start</span>';
                btnPlay.classList.remove('running');
            }

            const pct = Math.round(data.position * 100);
            document.getElementById('progressText').textContent = pct + '%';
            document.getElementById('progressFill').style.width = pct + '%';

            // Recording state on the REC button (Phase 5)
            const btnRec = document.getElementById('btnRec');
            if (data.recording) {
                btnRec.classList.add('active');
                btnRec.innerHTML = '<span class="btn-icon">⏹</span><span>Stop REC</span>';
            } else {
                btnRec.classList.remove('active');
                btnRec.innerHTML = '<span class="btn-icon">⏺</span><span>REC</span>';
            }

            applyPairing();
        }

        // ── Commands ────────────────────────────────────────
        function sendPair() {
            const code = document.getElementById('pairInput').value.trim();
            if (code) socket.emit('pair', code);
        }

        function togglePlay() { socket.emit('toggle'); }
        function wpmUp() { socket.emit('wpm_up'); }
        function wpmDown() { socket.emit('wpm_down'); }
        function restartScroll() { socket.emit('restart'); }
        function toggleRec() { socket.emit('rec_start'); }

        // ── Progress bar scrubbing (jump) ───────────────────
        const bar = document.getElementById('progressBar');
        let scrubbing = false;

        function scrubTo(clientX) {
            const rect = bar.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            document.getElementById('progressFill').style.width = (ratio * 100) + '%';
            return ratio;
        }

        bar.addEventListener('pointerdown', (e) => {
            if (!paired) return;
            scrubbing = true;
            scrubTo(e.clientX);
        });

        bar.addEventListener('pointermove', (e) => {
            if (scrubbing) scrubTo(e.clientX);
        });

        window.addEventListener('pointerup', (e) => {
            if (scrubbing) {
                scrubbing = false;
                socket.emit('jump', scrubTo(e.clientX));
            }
        });

        // Pair on Enter in the input
        document.getElementById('pairInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendPair();
        });
    </script>
</body>
</html>
